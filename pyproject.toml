[project]
name = "nonebot-plugin-chart-downloader"
version = "0.1.0"
description = "AstroDX chart lookup and single-song .adx downloader for NoneBot2"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["nonebot2>=2.5,<3", "nonebot-adapter-onebot>=2.4", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/MortisBot/nonebot-plugin-chart-downloader"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_chart_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
